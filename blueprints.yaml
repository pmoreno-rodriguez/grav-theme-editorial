name: Editorial
slug: editorial
type: theme
version: 4.3.2
description: GravCMS port of the HTML5UP theme Editorial
icon: text-width
author:
  name: Pedro Moreno
  email: pmoreno@pmdesign.dev
homepage: https://github.com/pmoreno-rodriguez/grav-theme-editorial
demo: https://editorial.pmdesign.dev/
docs: https://github.com/pmoreno-rodriguez/grav-theme-editorial/blob/main/README.md
keywords: grav, theme, etc
bugs: https://github.com/pmoreno-rodriguez/grav-theme-editorial/issues
readme: https://github.com/pmoreno-rodriguez/grav-theme-editorial/blob/develop/README.md
license: MIT
compatibility:
  grav: ["1.7", "2.0"]

dependencies:
  - { name: grav, version: ">=1.7.49.5" }

form:
  validation: loose

  fields:
    general:
      type: fieldset
      title: EDITORIAL.ADMIN.THEME.THEME_CONFIG_FIELDSET
      collapsible: true
      collapsed: false
      import@:
        type: theme/general
        context: blueprints://

    header:
      type: fieldset
      title: EDITORIAL.ADMIN.THEME.HEADER_FIELDSET
      collapsible: true
      collapsed: true
      import@:
        type: theme/header
        context: blueprints://

    sidebar:
      type: fieldset
      title: EDITORIAL.ADMIN.THEME.SIDEBAR.FIELDSET
      collapsible: true
      collapsed: true
      import@:
        type: theme/sidebar
        context: blueprints://

    blog:
      type: fieldset
      title: EDITORIAL.ADMIN.THEME.BLOG.FIELDSET
      collapsible: true
      collapsed: true
      import@:
        type: theme/blog
        context: blueprints://

    contact:
      type: fieldset
      title: EDITORIAL.ADMIN.THEME.CONTACT.FIELDSET
      collapsible: true
      collapsed: true
      import@:
        type: theme/contact
        context: blueprints://

    social:
      type: fieldset
      title: EDITORIAL.ADMIN.THEME.SOCIAL.FIELDSET
      collapsible: true
      collapsed: true
      import@:
        type: theme/social
        context: blueprints://

    custommenu:
      type: fieldset
      title: EDITORIAL.ADMIN.THEME.CUSTOM_MENU.FIELDSET
      collapsible: true
      collapsed: true
      import@:
        type: theme/custommenu
        context: blueprints://

    seo:
      type: fieldset
      title: EDITORIAL.ADMIN.THEME.SEO.FIELDSET
      collapsible: true
      collapsed: true
      import@:
        type: theme/seo
        context: blueprints://
