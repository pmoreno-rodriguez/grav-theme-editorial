title: Blog
'@extends':
    type: default
    context: blueprints://pages

child_type: item

rules:
  slug:
    pattern: "[a-z][a-z0-9_-]+"
    min: 2
    max: 80

form:
  fields:
    tabs:
      type: tabs
      active: 1

      fields:

        content:
          fields:
             header.page_index:
              unset@: true    
        advanced:
          fields:
            overrides:
              fields:
                header.child_type:
                  default: item
        blog:
          type: tab
          title: EDITORIAL.ADMIN.BLOG_TAB
          ordering@: 50
          fields:
            content_title:
              type: spacer
              title: EDITORIAL.ADMIN.BLOG_TITLE
            header.content.items:
              type: textarea
              yaml: true
              label: EDITORIAL.ADMIN.BLOG_ITEMS_LABEL
              default: '@self.children'
              validate:
                type: yaml
            header.content.limit:
              type: text
              label: EDITORIAL.ADMIN.BLOG_ITEMS_LIMIT
              size: small
              default: 5
              validate:
                required: true
                type: int
                min: 1
            header.content.order.by:
              type: select
              label: EDITORIAL.ADMIN.BLOG_ITEMS_ORDER_BY_LABEL
              size: medium
              default: date
              options:
                folder: EDITORIAL.ADMIN.BLOG_ITEMS_ORDER_BY_FOLDER
                title: EDITORIAL.ADMIN.BLOG_ITEMS_ORDER_BY_TITLE
                date: EDITORIAL.ADMIN.BLOG_ITEMS_ORDER_BY_DATE
                default: EDITORIAL.ADMIN.BLOG_ITEMS_ORDER_BY_DEFAULT
            header.content.order.dir:
              type: select
              label: EDITORIAL.ADMIN.BLOG_ITEMS_DIR
              size: medium
              default: desc
              options:
                asc: EDITORIAL.ADMIN.BLOG_ITEMS_DIR_ASC
                desc: EDITORIAL.ADMIN.BLOG_ITEMS_DIR_DESC
            header.content.pagination:
              type: toggle
              label: EDITORIAL.ADMIN.BLOG_PAGINATION_LABEL
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool            
            header.content.url_taxonomy_filters:
              type: toggle
              label: EDITORIAL.ADMIN.BLOG_URL_TAXONOMY_FILTERS
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
          import@:
            type: partials/blog-bits
            context: blueprints://pages
        
        seo:
          type: tab
          title: EDITORIAL.ADMIN.DEFAULT_SEO_TAB
          ordering@: 999
          import@: partials/seo-bits.yaml