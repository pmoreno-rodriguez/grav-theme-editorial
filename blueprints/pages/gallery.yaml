title: Gallery
'@extends': default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
             header.page_index:
              unset@: true
        gallery_images:
          type: tab
          title: EDITORIAL.ADMIN.GALLERY_TAB
          fields:
            content_title:
              type: spacer
              title: EDITORIAL.ADMIN.GALLERY_TITLE
            header.layout:
              type: select
              label: EDITORIAL.ADMIN.GALLERY_LAYOUT_LABEL
              default: standard
              size: medium
              options:
                medium: EDITORIAL.ADMIN.GALLERY_LAYOUT_TWOCOLS
                standard: EDITORIAL.ADMIN.GALLERY_LAYOUT_THREECOLS   
            header.thumb_width:
              type: number
              label: EDITORIAL.ADMIN.GALLERY_THUMB_WIDTH
              help: EDITORIAL.ADMIN.GALLERY_THUMB_WIDTH_HELP
              size: small
              default: 600
              validate:
                min: 50
                max: 1000
            header.thumb_height:
              type: number
              label: EDITORIAL.ADMIN.GALLERY_THUMB_HEIGHT
              help: EDITORIAL.ADMIN.GALLERY_THUMB_HEIGHT_HELP
              size: small
              default: 450
              validate:
                min: 50
                max: 1000
            header.images:
              type: list
              style: vertical
              label: EDITORIAL.ADMIN.GALLERY_IMAGES_LABEL
              collapsed: true
              fields:
                .image:
                  type: pagemediaselect
                  size: medium
                  label: EDITORIAL.ADMIN.GALLERY_IMAGES_IMAGE
                  preview_images: true
                  accept:
                  - .png
                  - .jpg
                  - .gif
                  - .svg
                  - .webp
                  - .jpeg
                .title:
                  type: text
                  size: medium
                  label: EDITORIAL.ADMIN.GALLERY_IMAGES_IMAGE_TITLE
                .description:
                  type: textarea
                  rows: 3
                  label: EDITORIAL.ADMIN.GALLERY_IMAGES_IMAGE_DESCRIPTION
                .descPosition:
                  type: select
                  label: EDITORIAL.ADMIN.GALLERY_IMAGES_DESCPOSITION_LABEL
                  help: EDITORIAL.ADMIN.GALLERY_IMAGES_DESCPOSITION_HELP
                  default: bottom
                  size: medium
                  options:
                    bottom: EDITORIAL.ADMIN.GALLERY_IMAGES_DESCPOSITION_BOTTOM
                    top: EDITORIAL.ADMIN.GALLERY_IMAGES_DESCPOSITION_TOP
                    left: EDITORIAL.ADMIN.GALLERY_IMAGES_DESCPOSITION_LEFT
                    right: EDITORIAL.ADMIN.GALLERY_IMAGES_DESCPOSITION_RIGHT
            Videos_title:
              type: spacer
              title: EDITORIAL.ADMIN.GALLERY_VIDEO_TITLE

            header.video_width:
              type: text
              label: EDITORIAL.ADMIN.GALLERY_VIDEO_WIDTH
              help: EDITORIAL.ADMIN.GALLERY_VIDEO_WIDTH_HELP
              placeholder: '960px'
              size: small
              default: '960px'

            header.autofocus_videos:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_VIDEO_AUTOFOCUS
              help: EDITORIAL.ADMIN.GALLERY_VIDEO_AUTOFOCUS_HELP
              default: 1
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED

            header.autoplay_videos:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_VIDEO_AUTOPLAY
              help: EDITORIAL.ADMIN.GALLERY_VIDEO_AUTOPLAY_HELP
              default: 1
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.videos:
              type: list
              style: vertical
              label: EDITORIAL.ADMIN.GALLERY_VIDEOS_LABEL
              collapsed: true
              fields:
                .source:
                  type: select
                  label: EDITORIAL.ADMIN.GALLERY_VIDEOS_SOURCE
                  description: EDITORIAL.ADMIN.GALLERY_VIDEOS_SOURCE_DESCRIPTION
                  size: medium
                  default: local
                  options:
                      remote: EDITORIAL.ADMIN.GALLERY_VIDEOS_SOURCE_OPTIONS_REMOTE
                      local: EDITORIAL.ADMIN.GALLERY_VIDEOS_SOURCE_OPTIONS_LOCAL
                .remote_video:
                  type: text
                  label: EDITORIAL.ADMIN.GALLERY_VIDEOS_REMOTE_VIDEO
                  description: EDITORIAL.ADMIN.GALLERY_VIDEOS_REMOTE_VIDEO_DESCRIPTION
                  size: medium
                .remote_thumbnail:
                  type: text
                  label: EDITORIAL.ADMIN.GALLERY_VIDEOS_REMOTE_THUMBNAIL
                  description: EDITORIAL.ADMIN.GALLERY_VIDEOS_REMOTE_THUMBNAIL_DESCRIPTION
                  size: medium
                .video:
                  type: pagemediaselect
                  size: medium
                  label: EDITORIAL.ADMIN.GALLERY_VIDEOS_LOCAL_VIDEO
                  preview_images: false
                  accept:
                    - .mp4
                    - .webm
                    - .ogv
                .local_thumbnail:
                  type: pagemediaselect
                  label: EDITORIAL.ADMIN.GALLERY_VIDEOS_LOCAL_THUMBNAIL
                  description: EDITORIAL.ADMIN.GALLERY_VIDEOS_LOCAL_THUMBNAIL_DESCRIPTION
                  size: medium
                  preview_images: true
                  accept:
                    - .png
                    - .jpg
                    - .jpeg
                    - .gif
                .title:
                  type: text
                  size: medium
                  label: EDITORIAL.ADMIN.GALLERY_VIDEOS_TITLE
                  validate:
                    required: true
                .description:
                  type: textarea
                  rows: 3
                  label: EDITORIAL.ADMIN.GALLERY_VIDEOS_DESCRIPTION
        gallery_options:
          type: tab
          title: EDITORIAL.ADMIN.GALLERY_OPTIONS_TAB
          fields:
            Effects_title:
              type: spacer
              title: EDITORIAL.ADMIN.GALLERY_OPTIONS_EFFECTS_TITLE
            header.lightbox_selector:
              type: text
              label: CSS Selector for Lightbox
              size: medium
              placeholder: 'glightbox'
              help: >
                Define the CSS selector for the elements that trigger the lightbox.
              default: 'glightbox'
            header.overlay_hover_effect:
              type: select
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_OVERLAY_HOVER_EFFECT_LABEL
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_OVERLAY_HOVER_EFFECT_HELP
              default: fadeIn-bottom
              size: medium
              options:
                fadeIn-bottom: EDITORIAL.ADMIN.GALLERY_OPTIONS_OVERLAY_HOVER_EFFECT_FADEIN_BOTTOM
                fadeIn-top: EDITORIAL.ADMIN.GALLERY_OPTIONS_OVERLAY_HOVER_EFFECT_FADEIN_TOP
                fadeIn-left: EDITORIAL.ADMIN.GALLERY_OPTIONS_OVERLAY_HOVER_EFFECT_FADEIN_LEFT
                fadeIn-right: EDITORIAL.ADMIN.GALLERY_OPTIONS_OVERLAY_HOVER_EFFECT_FADEIN_RIGHT
                fadeIn-top fadeIn-right: EDITORIAL.ADMIN.GALLERY_OPTIONS_OVERLAY_HOVER_EFFECT_FADEIN_TOP_RIGHT
                fadeIn-top fadeIn-left: EDITORIAL.ADMIN.GALLERY_OPTIONS_OVERLAY_HOVER_EFFECT_FADEIN_TOP_LEFT
                fadeIn-bottom fadeIn-right: EDITORIAL.ADMIN.GALLERY_OPTIONS_OVERLAY_HOVER_EFFECT_FADEIN_BOTTOM_RIGHT
                fadeIn-bottom fadeIn-left: EDITORIAL.ADMIN.GALLERY_OPTIONS_OVERLAY_HOVER_EFFECT_FADEIN_BOTTOM_LEFT
            header.open_effect:
              type: select
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_OPEN_EFFECT_LABEL
              default: zoom
              size: medium
              options:
                zoom: EDITORIAL.ADMIN.GALLERY_OPTIONS_OPEN_EFFECT_ZOOM
                fade: EDITORIAL.ADMIN.GALLERY_OPTIONS_OPEN_EFFECT_FADE
                none: EDITORIAL.ADMIN.GALLERY_OPTIONS_OPEN_EFFECT_NONE
            header.close_effect:
              type: select
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_CLOSE_EFFECT_LABEL
              default: zoom
              size: medium
              options:
                zoom: EDITORIAL.ADMIN.GALLERY_OPTIONS_CLOSE_EFFECT_ZOOM
                fade: EDITORIAL.ADMIN.GALLERY_OPTIONS_CLOSE_EFFECT_FADE
                none: EDITORIAL.ADMIN.GALLERY_OPTIONS_CLOSE_EFFECT_NONE
            header.slide_effect:
              type: select
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_SLIDE_EFFECT_LABEL
              default: slide
              size: medium
              options:
                slide: EDITORIAL.ADMIN.GALLERY_OPTIONS_SLIDE_EFFECT_SLIDE
                zoom: EDITORIAL.ADMIN.GALLERY_OPTIONS_SLIDE_EFFECT_ZOOM
                fade: EDITORIAL.ADMIN.GALLERY_OPTIONS_SLIDE_EFFECT_FADE
                none: EDITORIAL.ADMIN.GALLERY_OPTIONS_SLIDE_EFFECT_NONE
            header.more_text:
              type: text
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_MORE_TEXT
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_MORE_TEXT_HELP
              default: 'Ver más'
              size: medium
            header.more_length:
              type: number
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_MORE_LENGTH
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_MORE_LENGTH_HELP
              size: small
              default: 60
              validate:
                min: 0
                max: 500
            Actions_title:
              type: spacer
              title: EDITORIAL.ADMIN.GALLERY_OPTIONS_ACTIONS_TITLE
            header.close_button:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_CLOSE_BUTTON
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_CLOSE_BUTTON_HELP
              default: 1
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.touch_navigation:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_TOUCH_NAVIGATION
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_TOUCH_NAVIGATION_HELP
              default: 1
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.touch_axis:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_TOUCH_AXIS
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_TOUCH_AXIS_HELP
              default: 1
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.keyboard_navigation:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_KEYBOARD
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_KEYBOARD_HELP
              default: 1
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.closeOutside:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_CLOSE_OUTSIDE
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_CLOSE_OUTSIDE_HELP
              default: 1
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.startAt:
              type: number
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_MORE_STARTAT
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_MORE_STARTAT_HELP
              size: small
              validate:
                min: 0
                max: 1000
            Styling_title:
              type: spacer
              title: EDITORIAL.ADMIN.GALLERY_OPTIONS_STYLING_TITLE
            header.width:
              type: text
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_WIDTH
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_WIDTH_HELP
              placeholder: 'auto'
              size: small
            header.height:
              type: text
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_HEIGHT
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_HEIGHT_HELP
              placeholder: 'auto'
              size: small
            Behavior_title:
              type: spacer
              title: EDITORIAL.ADMIN.GALLERY_OPTIONS_BEHAVIOR_TITLE
            header.loop:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_LOOP
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_LOOP_HELP
              default: 0
              highlight: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.zoomable:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_ZOOMABLE
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_ZOOMABLE_HELP
              default: 1
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.draggable:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_DRAGGABLE
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_DRAGGABLE_HELP
              default: 1
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.draggableX:
              type: number
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_DRAGGABLE_X
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_DRAGGABLE_X_HELP
              size: small
              default: 40
              validate:
                min: 1
                max: 500
            header.draggableY:
              type: number
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_DRAGGABLE_Y
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_DRAGGABLE_Y_HELP
              size: small
              default: 65
              validate:
                min: 1
                max: 500
            header.dragAuto:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_DRAG_AUTO_SNAP
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_DRAG_AUTO_SNAP_HELP
              default: 0
              highlight: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.preload:
              type: toggle
              label: EDITORIAL.ADMIN.GALLERY_OPTIONS_PRELOAD
              help: EDITORIAL.ADMIN.GALLERY_OPTIONS_PRELOAD_HELP
              default: 1
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED  
        seo:
          type: tab
          title: EDITORIAL.ADMIN.DEFAULT_SEO_TAB
          ordering@: 99
          import@: partials/seo-tab.yaml        
