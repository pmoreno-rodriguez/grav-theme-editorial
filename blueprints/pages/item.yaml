extends@: default

form:
  fields:
    tabs:

      fields:
        content:
          fields:
             header.page_index:
              unset@: true
        blog-item:
          type: tab
          title: EDITORIAL.ADMIN.ITEM_TAB
          fields:
            summary:
              type: section
              title: EDITORIAL.ADMIN.ITEM_SUMMARY_TITLE
              underline: true
            header.summary.enabled:
              type: toggle
              toggleable: true
              label: EDITORIAL.ADMIN.ITEM_SUMMARY_ENABLED
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.summary.format:
              type: select
              toggleable: true
              label: EDITORIAL.ADMIN.ITEM_SUMMARY_FORMAT
              classes: fancy
              options:
                'short': EDITORIAL.ADMIN.ITEM_SUMMARY_FORMAT_SHORT
                'long': EDITORIAL.ADMIN.ITEM_SUMMARY_FORMAT_LONG
            header.summary.size:
              type: text
              toggleable: true
              label: EDITORIAL.ADMIN.ITEM_SUMMARY_SIZE
              classes: large
              placeholder: 300
              validate:
                type: int
                min: 1
            header.summary.delimiter:
              type: text
              toggleable: true
              label: EDITORIAL.ADMIN.ITEM_SUMMARY_DELIMITER
              classes: large
              placeholder: ===
            shareicons:
              type: section
              title: EDITORIAL.ADMIN.ITEM_SHAREICONS_TITLE
              underline: true
            header.shareicons.facebook:
              type: toggle
              toggleable: true
              label: EDITORIAL.ADMIN.ITEM_SHAREICONS_FACEBOOK
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.shareicons.twitter:
              type: toggle
              toggleable: true
              label: EDITORIAL.ADMIN.ITEM_SHAREICONS_TWITTER
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.shareicons.whatsapp:
              type: toggle
              toggleable: true
              label: EDITORIAL.ADMIN.ITEM_SHAREICONS_WHATSAPP
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.shareicons.telegram:
              type: toggle
              toggleable: true
              label: EDITORIAL.ADMIN.ITEM_SHAREICONS_TELEGRAM
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
        seo:
          type: tab
          title: EDITORIAL.ADMIN.DEFAULT_SEO_TAB
          ordering@: 99
          import@: partials/seo-tab.yaml