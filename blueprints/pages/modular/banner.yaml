title: EDITORIAL.ADMIN.MODULAR.BANNER.TAB
'@extends': default

form:
  fields:
    tabs:
      fields:
        content:
          type: tab
          fields:
            header.page_index:
              unset@: true
            _BannerSection:
              type: section
              underline: true
              ordering@: _ContentOptions
              title: EDITORIAL.ADMIN.MODULAR_BANNER_SECTION
            _BannerOptions:
              type: columns
              ordering@: _BannerSection
              fields:
                header.content:
                  type: column
                  fields:
                    header.title_htag:
                      type: select
                      label: EDITORIAL.ADMIN.MODULAR_BANNER_TITLE_HTAG
                      help: EDITORIAL.ADMIN.MODULAR_BANNER_TITLE_HTAG_HELP
                      size: small
                      options:
                        h1: H1
                        h2: H2
                    header.button_text:
                      type: text
                      size: medium
                      label: EDITORIAL.ADMIN.MODULAR_BANNER_BUTTON_TEXT
                    header.button_url:
                      type: text
                      size: medium
                      label: EDITORIAL.ADMIN.MODULAR_BANNER_BUTTON_URL
        seo:
          unset@: true
            

                
