title: EDITORIAL.ADMIN.MODULAR_RECENT_POSTS_TAB
'@extends': default

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          fields:
            header.page_index:
              unset@: true
        bloglist:
          type: tab
          title: EDITORIAL.ADMIN.MODULAR_RECENT_POSTS_TAB
          fields:
            header.blog_url:
              type: text
              label: EDITORIAL.ADMIN.BLOG_ROUTE
              help: EDITORIAL.ADMIN.BLOG_ROUTE_HELP
              default: '/blog'
              placeholder: '/blog'
              size: medium
            header.limit:
              type: number
              size: small
              label: EDITORIAL.ADMIN.MODULAR_RECENT_POSTS_LIMIT
              help: EDITORIAL.ADMIN.MODULAR_RECENT_POSTS_LIMIT_HELP
              default: 3
              validate:
                type: int
                min: 1
                max: 9
            header.readmore_text:
              type: text
              toggleable: true
              default: 'Read more'
              size: large
              label: EDITORIAL.ADMIN.MODULAR_RECENT_POSTS_READMORE_TEXT
              description: EDITORIAL.ADMIN.MODULAR_RECENT_POSTS_READMORE_TEXT_DESCRIPTION
        seo:
          unset@: true