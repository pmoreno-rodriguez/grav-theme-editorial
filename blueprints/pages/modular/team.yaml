title: EDITORIAL.ADMIN.MODULAR_TEAM_TAB
'@extends': default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.page_index:
              unset@: true
        TEAM:
          type: tab
          title: EDITORIAL.ADMIN.MODULAR_TEAM_TAB
          fields:
            header.layout:
              type: select
              label: EDITORIAL.ADMIN.MODULAR_TEAM_TEAM_LAYOUT
              default: standard
              size: medium
              options:
                medium: EDITORIAL.ADMIN.MODULAR_TEAM_TEAM_LAYOUT_TWOCOLS
                standard: EDITORIAL.ADMIN.MODULAR_TEAM_TEAM_LAYOUT_THREECOLS
            header.team:
              name: team
              type: list
              size: long
              collapsed: true
              label: EDITORIAL.ADMIN.MODULAR_TEAM_TAB
              fields:
                .image:
                  type: pagemediaselect
                  size: medium
                  label: EDITORIAL.ADMIN.MODULAR_TEAM_IMAGE
                  help: EDITORIAL.ADMIN.MODULAR_TEAM_IMAGE_HELP
                  preview_images: true
                .name:
                  type: text
                  size: medium
                  label: EDITORIAL.ADMIN.MODULAR_TEAM_NAME
                .position:
                  type: text
                  size: medium
                  label: EDITORIAL.ADMIN.MODULAR_TEAM_POSITION
                .details:
                  type: textarea
                  columns: 4
                  label: EDITORIAL.ADMIN.MODULAR_TEAM_DETAILS
                  help: EDITORIAL.ADMIN.MODULAR_TEAM_DETAILS_HELP
                .social_media:
                  type: list
                  label: EDITORIAL.ADMIN.MODULAR_TEAM_SOCIAL_MEDIA_LABEL
                  help: EDITORIAL.ADMIN.MODULAR_TEAM_SOCIAL_MEDIA_HELP
                  collapsed: true
                  max: 6
                  fields:
                    .name:
                      type: text
                      size: small
                      label: EDITORIAL.ADMIN.MODULAR_TEAM_SOCIAL_MEDIA_NAME
                      help: EDITORIAL.ADMIN.MODULAR_TEAM_SOCIAL_MEDIA_NAME_HELP
                    .url:
                      type: text
                      size: small
                      label: EDITORIAL.ADMIN.MODULAR_TEAM_SOCIAL_MEDIA_URL
        seo:
          unset@: true
