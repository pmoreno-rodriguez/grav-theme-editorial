title: Custom Menu

form:
  fields:
    custommenu_section:
      type: section
      title: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_TITLE
      underline: true
    
    custommenu_enabled:
      type: toggle
      label: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ENABLE
      help: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ENABLE_HELP
      default: 0
      highlight: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    
    custommenu:
      name: menu
      type: list
      label: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_LABEL
      fields:
        .text:
          type: text
          label: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_TEXT
          description: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_TEXT_DESCRIPTION
        
        .icon:
          type: text
          label: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_ICON
          description: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_ICON_DESCRIPTION
        
        .url:
          type: text
          label: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_URL
          description: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_URL_DESCRIPTION
        
        .target:
          type: select
          label: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_TARGET_LABEL
          default: _self
          size: medium
          options:
            _blank: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_TARGET_BLANK
            _parent: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_TARGET_PARENT
            _self: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_TARGET_SELF
            _top: EDITORIAL.ADMIN.THEME_CUSTOM_MENU_ITEM_TARGET_TOP