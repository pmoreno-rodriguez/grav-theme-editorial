title: General Settings

form:
  fields:
    
    dropdown.enabled:
      type: toggle
      label: EDITORIAL.ADMIN.THEME_DROPDOWN_MENU
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    
    production-mode:
      type: toggle
      label: EDITORIAL.ADMIN.THEME_PRODUCTION_MODE
      help: EDITORIAL.ADMIN.THEME_PRODUCTION_MODE_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    
    google_fonts_local:
      type: toggle
      label: EDITORIAL.ADMIN.THEME_GOOGLE_FONTS_LOCAL
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    
    custom_css:
      type: toggle
      label: EDITORIAL.ADMIN.THEME_CUSTOM_CSS
      help: EDITORIAL.ADMIN.THEME_CUSTOM_CSS_HELP
      highlight: 1
      default: true
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
    
    custom_js:
      type: toggle
      label: EDITORIAL.ADMIN.THEME_CUSTOM_JS
      help: EDITORIAL.ADMIN.THEME_CUSTOM_JS_HELP
      highlight: 1
      default: true
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
    
    copyright.text:
      type: textarea
      rows: 2
      size: long
      label: EDITORIAL.ADMIN.THEME_CONTACT_COPYRIGHT_TEXT
      help: EDITORIAL.ADMIN.THEME_CONTACT_COPYRIGHT_TEXT_HELP
