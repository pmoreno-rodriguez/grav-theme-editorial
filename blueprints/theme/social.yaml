title: Social Media

form:
  fields:

    social_enabled:
      type: toggle
      label: EDITORIAL.ADMIN.THEME_SOCIAL_ENABLED
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    social:
      name: social
      label: EDITORIAL.ADMIN.THEME_SOCIAL_ICONS
      type: list
      style: vertical
      collapsed: false
      max: 5
      fields:
        .name:
          type: text
          label: EDITORIAL.ADMIN.THEME_SOCIAL_NAME
          size: medium
        .url:
          type: text
          label: EDITORIAL.ADMIN.THEME_SOCIAL_URL
        .target:
          type: select
          label: EDITORIAL.ADMIN.THEME_SOCIAL_TARGET_LABEL
          default: _self
          size: medium
          options:
            _blank: EDITORIAL.ADMIN.THEME_SOCIAL_TARGET_BLANK
            _parent: EDITORIAL.ADMIN.THEME_SOCIAL_TARGET_PARENT
            _self: EDITORIAL.ADMIN.THEME_SOCIAL_TARGET_SELF
            _top: EDITORIAL.ADMIN.THEME_SOCIAL_TARGET_TOP
        .icon:
          type: text
          label: EDITORIAL.ADMIN.THEME_SOCIAL_ICON
          description: EDITORIAL.ADMIN.THEME_SOCIAL_ICON_HELP
          size: medium
        .icon_type:
          type: select
          label: EDITORIAL.ADMIN.THEME_SOCIAL_ICON_TYPE
          default: brands
          size: medium
          options:
            brands: Brands
            solid: Solid
            regular: Regular
